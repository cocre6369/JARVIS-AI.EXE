name: Build JARVIS-AI.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the .exe files to the 'nightly' release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JARVIS-AI
            slim: "0"
            req: requirements-full.txt
          - name: JARVIS-AI-Lite
            slim: "1"
            req: requirements.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r ${{ matrix.req }}

      - name: Generate window icon
        run: python scripts/make_icon.py

      - name: Build ${{ matrix.name }}.exe
        env:
          JARVIS_SLIM: ${{ matrix.slim }}
          JARVIS_NAME: ${{ matrix.name }}
        run: pyinstaller JARVIS.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.exe
          if-no-files-found: error

  release:
    name: Publish nightly release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish .exe files to the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "== downloaded artifact tree ==" && find dist -type f | head -20
          mapfile -t EXES < <(find dist -type f -name '*.exe' | sort)
          echo "found ${#EXES[@]} binaries"
          if [ "${#EXES[@]}" -lt 1 ]; then
            echo "::error::No .exe files in build artifacts — aborting release" && exit 1
          fi

          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "J.A.R.V.I.S. — Nightly Build" --notes "Build in progress…"
          fi

          gh release upload nightly --repo "$GITHUB_REPOSITORY" --clobber "${EXES[@]}"

          LISTING=$(for f in "${EXES[@]}"; do
            printf -- '- **%s** — %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
          done)
          gh release edit nightly --repo "$GITHUB_REPOSITORY" \
            --title "J.A.R.V.I.S. — Nightly Build" \
            --notes "$(printf '%s\n' \
              "Standalone Windows builds of J.A.R.V.I.S., the local Ollama-powered desktop assistant." \
              "" "### Downloads" "$LISTING" "" \
              "1. Install [Ollama](https://ollama.com/download) and run: \`ollama pull llama3.2\`" \
              "2. Download the .exe and double-click it" \
              "3. Follow the first-run wizard" "" \
              "Built from commit $GITHUB_SHA")"

          echo "== release assets now =="
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" \
            --jq '{assets: [.assets[] | {name, size}]}'
